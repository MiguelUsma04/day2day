<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>day2day</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes"
    />
    <meta
      name="description"
      content="Tu cronograma diario: arma tu rutina y cúmplela, desde que te levantas hasta que te duermes."
    />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="day2day" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #f3f6fd;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: #0f172a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              // An installed PWA is usually resumed, not reloaded, so poll for a
              // new build on launch and whenever it returns to the foreground.
              var check = function () {
                reg.update().catch(function () {});
              };
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') check();
              });
              setInterval(check, 60 * 60 * 1000);

              reg.addEventListener('updatefound', function () {
                var next = reg.installing;
                if (!next) return;
                next.addEventListener('statechange', function () {
                  // Only reload for a genuine replacement, never the first install.
                  if (next.state === 'installed' && navigator.serviceWorker.controller) {
                    next.postMessage('SKIP_WAITING');
                  }
                });
              });
            })
            .catch(function () {
              // Offline support is an enhancement; the app still runs without it.
            });

          var refreshed = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (refreshed) return;
            refreshed = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
